<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaspDash Smart Dashboard (Dynamic)</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Background layer -->
    <div id="background-container">
        <img id="bg1" class="bg-image active" alt="background 1">
        <img id="bg2" class="bg-image" alt="background 2">
    </div>

    <!-- Widgets layer: zones are populated at runtime by app-dynamic.js from Firestore -->
    <div id="dashboard">
        <div class="top-row" id="zone-top"></div>

        <div class="bottom-row">
            <div class="column left-column" id="zone-left"></div>
            <div class="column right-column" id="zone-right"></div>
        </div>
    </div>


    <script type="module" src="js/app-dynamic.js"></script>
</body>

</html>
